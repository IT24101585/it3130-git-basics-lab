<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Profile</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #ffffff;
            padding: 24px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            text-align: center;
        }
        h1 {
            color: #333333;
            margin-bottom: 8px;
        }
        p {
            color: #666666;
            line-height: 1.5;
        }
        .badge {
            display: inline-block;
            background-color: #007bff;
            color: white;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 14px;
            margin-top: 8px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Student Profile</h1>
        <p>IT3130 - Version Controlling with Git II</p>
        <span class="badge">Part 1 Feature Branch</span>
        <hr style="margin: 16px 0; border: none; border-top: 1px solid #eee;">
        <p>This profile page was created to demonstrate feature branching, pull requests, and the GitHub Flow cycle.</p>
    </div>

</body>
</html>
